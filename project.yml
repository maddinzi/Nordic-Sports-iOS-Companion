# XcodeGen project description (https://github.com/yonaskolb/XcodeGen). The Xcode project
# is generated from this file on the Mac (CI: .github/workflows/ios-testflight.yml) and
# never committed or edited by hand.
name: NordicSportsCompanion

options:
  bundleIdPrefix: me.maddin.nordicsports
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 6H79YB6QQS
    CODE_SIGN_STYLE: Automatic
    # Lockstep with the Companion's versionName (and the watch version). CI sets the build
    # number (CURRENT_PROJECT_VERSION) from the workflow run number.
    MARKETING_VERSION: "0.9.89"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

packages:
  # Garmin's Connect IQ Mobile SDK (binary XCFramework), for the watch link.
  ConnectIQ:
    url: https://github.com/garmin/connectiq-companion-app-sdk-ios
    exactVersion: 1.8.0

targets:
  NordicSportsCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
      # Spike 1 (throw-away): the app is the watch link test for now.
      - path: spikes/watch-link
    dependencies:
      - package: ConnectIQ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.maddin.nordicsports.companion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # The Connect IQ SDK uses Objective-C categories internally.
        OTHER_LDFLAGS: -ObjC
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nordic Sports Companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # HTTPS only (standard encryption, exempt) - skips the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        # Garmin Connect Mobile returns the watch selection through this scheme.
        CFBundleURLTypes:
          - CFBundleURLName: me.maddin.nordicsports.companion.ciq
            CFBundleURLSchemes:
              - nordicsports-ciq
        # Lets the Connect IQ SDK check that Garmin Connect Mobile is installed.
        LSApplicationQueriesSchemes:
          - gcm-ciq
        NSBluetoothAlwaysUsageDescription: Nordic Sports Companion connects to your Garmin watch over Bluetooth to receive your activities and send settings to the watch app.
        NSBluetoothPeripheralUsageDescription: Nordic Sports Companion connects to your Garmin watch over Bluetooth to receive your activities and send settings to the watch app.
        # Woken in the background when the watch sends data (part of what spike 1 measures).
        UIBackgroundModes:
          - bluetooth-central
    scheme: {}
