# XcodeGen project description (https://github.com/yonaskolb/XcodeGen). The Xcode project
# is generated from this file on the Mac (CI: .github/workflows/ios-testflight.yml) and
# never committed or edited by hand.
name: NordicSportsCompanion

options:
  bundleIdPrefix: me.maddin.nordicsports
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 6H79YB6QQS
    CODE_SIGN_STYLE: Automatic
    # Lockstep with the Companion's versionName (and the watch version). CI sets the build
    # number (CURRENT_PROJECT_VERSION) from the workflow run number.
    MARKETING_VERSION: "0.9.89"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  NordicSportsCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.maddin.nordicsports.companion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nordic Sports Companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # HTTPS only (standard encryption, exempt) - skips the export compliance question.
        ITSAppUsesNonExemptEncryption: false
    scheme: {}
