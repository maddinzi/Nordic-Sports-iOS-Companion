# XcodeGen project description (https://github.com/yonaskolb/XcodeGen). The Xcode project
# is generated from this file on the Mac (CI: .github/workflows/ios-testflight.yml) and
# never committed or edited by hand.
name: NordicSportsCompanion

options:
  bundleIdPrefix: me.maddin.nordicsports
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: 6H79YB6QQS
    CODE_SIGN_STYLE: Automatic
    # Lockstep with the Companion's versionName (and the watch version). CI sets the build
    # number (CURRENT_PROJECT_VERSION) from the workflow run number.
    MARKETING_VERSION: "0.9.100"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

packages:
  # Garmin's Connect IQ Mobile SDK (binary XCFramework), for the watch link.
  ConnectIQ:
    url: https://github.com/garmin/connectiq-companion-app-sdk-ios
    exactVersion: 1.8.0

targets:
  NordicSportsCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
      # The watch link spike carries the real watch connection until it gets its own adapter;
      # the background spike registers the BGTaskScheduler tasks.
      - path: spikes/watch-link
      - path: spikes/background
    # Strava app credentials and the webhook server key, written by CI from the repo's secrets
    # (gitignored; never committed). Read by the app from Info.plist (Companion.swift).
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    # Strava's https sign-in redirect returns to the app through the server's
    # apple-app-site-association (api.nordicsports.maddin.me/.well-known/).
    entitlements:
      path: App/NordicSportsCompanion.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:api.nordicsports.maddin.me
          - webcredentials:api.nordicsports.maddin.me
    dependencies:
      - package: ConnectIQ
      # The Companion's shared Kotlin module, built by CI into Frameworks/ (static: linked,
      # not embedded).
      - framework: Frameworks/NordicSportsShared.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.maddin.nordicsports.companion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # The Connect IQ SDK uses Objective-C categories internally.
        OTHER_LDFLAGS: -ObjC
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nordic Sports Companion
        CFBundleDevelopmentRegion: en
        # Same six languages as the Android Companion; texts from App/Localizable.xcstrings
        # (Swift) and App/Texts/texts-<lang>.json (shared Kotlin code), both generated on CI
        # by tools/generate_strings.py.
        CFBundleLocalizations: [en, de, fr, it, rm, gsw, nb, fi, sv]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # From Secrets.xcconfig (CI); empty in a build without the secrets.
        StravaClientId: $(STRAVA_CLIENT_ID)
        StravaClientSecret: $(STRAVA_CLIENT_SECRET)
        WebhookApiKey: $(WEBHOOK_API_KEY)
        # The diary clouds' app ids (sign-in with PKCE, no secrets); empty hides that cloud.
        OneDriveClientId: $(ONEDRIVE_CLIENT_ID)
        DropboxAppKey: $(DROPBOX_APP_KEY)
        GoogleClientId: $(GOOGLE_IOS_CLIENT_ID)
        # The diary backups (Documents/diary-backups) show in Files under On My iPhone.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # HTTPS only (standard encryption, exempt) - skips the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        # Garmin Connect Mobile returns the watch selection through this scheme.
        CFBundleURLTypes:
          - CFBundleURLName: me.maddin.nordicsports.companion.ciq
            CFBundleURLSchemes:
              - nordicsports-ciq
        # Lets the Connect IQ SDK check that Garmin Connect Mobile is installed.
        LSApplicationQueriesSchemes:
          - gcm-ciq
        NSBluetoothAlwaysUsageDescription: Nordic Sports Companion connects to your Garmin watch over Bluetooth to receive your activities and send settings to the watch app.
        NSBluetoothPeripheralUsageDescription: Nordic Sports Companion connects to your Garmin watch over Bluetooth to receive your activities and send settings to the watch app.
        # Woken in the background when the watch sends data (part of what spike 1 measures).
        UIBackgroundModes:
          - bluetooth-central
          # Spike 2: app refresh and processing tasks (BGTaskScheduler).
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - me.maddin.nordicsports.companion.refresh
          - me.maddin.nordicsports.companion.processing
    scheme: {}
