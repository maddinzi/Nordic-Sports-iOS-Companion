name: iOS TestFlight

# Builds the app on a cloud Mac and uploads it to TestFlight. Started by hand
# (Actions > iOS TestFlight > Run workflow) - macOS minutes are expensive.
# Signing: automatic, with the App Store Connect API key in the secrets
# ASC_ISSUER_ID, ASC_KEY_ID and ASC_KEY_P8 (never printed, deleted after the run).
on:
  workflow_dispatch:
    inputs:
      companion_ref:
        description: "Companion branch or tag for the shared module (main unless a branch awaits its Android test)"
        default: main

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # Must match provisioningProfiles in ExportOptions.plist.
      PROFILE_NAME: Nordic Sports Companion App Store CI
    steps:
      - uses: actions/checkout@v7

      # The runner context isn't available in the job's env block, so paths are set here.
      - name: Paths
        run: |
          echo "KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/NordicSportsCompanion.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/export" >> "$GITHUB_ENV"

      - name: Xcode version
        run: xcodebuild -version

      # The shared Kotlin module lives in the private Companion repo. COMPANION_READ_TOKEN is a
      # fine-grained token with read-only "Contents" on that one repository.
      - uses: actions/checkout@v7
        with:
          repository: maddinzi/Nordic-Sports-Companion
          ref: ${{ inputs.companion_ref || 'main' }}
          token: ${{ secrets.COMPANION_READ_TOKEN }}
          path: companion

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Kotlin/Native toolchain (~1 GB), downloaded on first use.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('companion/build.gradle.kts', 'companion/gradle.properties') }}

      # gradlew is committed from Windows without the executable bit. The app links the
      # static XCFramework from Frameworks/ (project.yml).
      - name: Build the shared XCFramework
        working-directory: companion
        run: |
          bash ./gradlew --console=plain :shared:assembleNordicSportsSharedReleaseXCFramework
          mkdir -p ../Frameworks
          cp -R shared/build/XCFrameworks/release/NordicSportsShared.xcframework ../Frameworks/

      # The Android texts are the only source of every text in all six languages
      # (docs/decision-shared-texts.md); the generated catalog is compiled into the app.
      - name: Generate the iOS texts from the Companion
        run: |
          python3 -m unittest discover -s tools -p "test_*.py"
          python3 tools/generate_strings.py companion/app/src/main/res App/Localizable.xcstrings App/Texts

      # Strava app credentials and the webhook server key (repo secrets) into the gitignored
      # Secrets.xcconfig that project.yml reads; the app takes them from Info.plist. Values
      # are never printed; only whether each one is set.
      - name: App secrets
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          WEBHOOK_API_KEY: ${{ secrets.WEBHOOK_API_KEY }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          {
            echo "STRAVA_CLIENT_ID = $STRAVA_CLIENT_ID"
            echo "STRAVA_CLIENT_SECRET = $STRAVA_CLIENT_SECRET"
            echo "WEBHOOK_API_KEY = $WEBHOOK_API_KEY"
            echo "ONEDRIVE_CLIENT_ID = $ONEDRIVE_CLIENT_ID"
            echo "DROPBOX_APP_KEY = $DROPBOX_APP_KEY"
            echo "GOOGLE_IOS_CLIENT_ID = $GOOGLE_IOS_CLIENT_ID"
          } > Secrets.xcconfig
          for name in STRAVA_CLIENT_ID STRAVA_CLIENT_SECRET WEBHOOK_API_KEY ONEDRIVE_CLIENT_ID DROPBOX_APP_KEY GOOGLE_IOS_CLIENT_ID; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "$name: MISSING"; fi
          done

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      # Checks the key's shape and asks the App Store Connect API directly, so a 401 comes
      # with Apple's reason. Prints only lengths, formats and the API's answer - never the key.
      - name: Check the API key
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 - <<'PY'
          import json, os, re, time, urllib.request, urllib.error
          import jwt

          key_id, issuer = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]
          key = open(os.environ["KEY_PATH"], encoding="utf-8").read()
          print("Key ID: 10 characters, letters and digits:", bool(re.fullmatch(r"[A-Z0-9]{10}", key_id)))
          print("Issuer ID: a UUID:", bool(re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", issuer)))
          print("Key file: starts with BEGIN PRIVATE KEY:", key.lstrip().startswith("-----BEGIN PRIVATE KEY-----"))
          print("Key file: ends with END PRIVATE KEY:", key.rstrip().endswith("-----END PRIVATE KEY-----"))
          print("Key file: lines:", len(key.strip().splitlines()))

          token = jwt.encode(
              {"iss": issuer, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"},
          )
          url = "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=me.maddin.nordicsports.companion"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
          try:
              with urllib.request.urlopen(request) as response:
                  apps = json.load(response)["data"]
                  print("App Store Connect API: OK, apps with this bundle id:", [a["attributes"]["name"] for a in apps])
          except urllib.error.HTTPError as e:
              print("App Store Connect API: HTTP", e.code)
              for err in json.load(e).get("errors", []):
                  print(" -", err.get("code"), "|", err.get("title"), "|", err.get("detail"))
              raise SystemExit(1)
          PY

      # The team's Apple Distribution certificate (secrets DIST_CERT_P12 as base64 and
      # DIST_CERT_PASSWORD), in a temporary keychain. Signing for the App Store this way
      # needs no registered device, and no new certificate is created per run.
      - name: Signing certificate
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          # Fingerprints only, to compare with the files the secrets came from - never the values.
          echo "password length: ${#DIST_CERT_PASSWORD}, sha256 prefix: $(printf '%s' "$DIST_CERT_PASSWORD" | shasum -a 256 | cut -c1-8)"
          echo "p12 base64 length: ${#DIST_CERT_P12}, decoded p12 sha256 prefix: $(shasum -a 256 "$RUNNER_TEMP/dist.p12" | cut -c1-16)"
          if openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -passin env:DIST_CERT_PASSWORD -noout > /dev/null 2>&1; then
            echo "openssl: the password opens the p12"
          else
            echo "openssl: the password does NOT open the p12 (or the p12 is damaged)"
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # The certificate's serial number finds it in App Store Connect for the profile.
          CERT_SERIAL="$(openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -passin env:DIST_CERT_PASSWORD -nokeys | openssl x509 -noout -serial | cut -d= -f2)"
          echo "CERT_SERIAL=$CERT_SERIAL" >> "$GITHUB_ENV"
          echo "certificate serial: $CERT_SERIAL"
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      # An App Store provisioning profile for our bundle id and certificate, created via
      # the API (replacing the one from the previous run) and installed for Xcode.
      - name: Provisioning profile
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, time, urllib.error, urllib.parse, urllib.request
          import jwt

          API = "https://api.appstoreconnect.apple.com/v1"
          BUNDLE_ID = "me.maddin.nordicsports.companion"
          NAME = os.environ["PROFILE_NAME"]
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"},
              open(os.environ["KEY_PATH"], encoding="utf-8").read(), algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
          )

          def call(method, path, body=None):
              request = urllib.request.Request(
                  API + path, method=method, data=json.dumps(body).encode() if body else None,
                  headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      text = response.read()
                      return json.loads(text) if text else {}
              except urllib.error.HTTPError as e:
                  print(method, path, "-> HTTP", e.code)
                  for err in json.load(e).get("errors", []):
                      print(" -", err.get("code"), "|", err.get("title"), "|", err.get("detail"))
                  raise SystemExit(1)

          bundle = call("GET", "/bundleIds?filter[identifier]=" + BUNDLE_ID)["data"]
          bundle = [b for b in bundle if b["attributes"]["identifier"] == BUNDLE_ID]
          if not bundle:
              raise SystemExit("No App ID " + BUNDLE_ID + " in the developer portal")

          # Associated Domains (Strava's https sign-in redirect as a Universal Link) must be
          # on for the App ID before the profile is made, or the entitlement is rejected.
          capabilities = call("GET", "/bundleIds/" + bundle[0]["id"] + "/bundleIdCapabilities")["data"]
          if not any(c["attributes"].get("capabilityType") == "ASSOCIATED_DOMAINS" for c in capabilities):
              call("POST", "/bundleIdCapabilities", {"data": {
                  "type": "bundleIdCapabilities",
                  "attributes": {"capabilityType": "ASSOCIATED_DOMAINS"},
                  "relationships": {"bundleId": {"data": {"type": "bundleIds", "id": bundle[0]["id"]}}},
              }})
              print("enabled Associated Domains for", BUNDLE_ID)
          else:
              print("Associated Domains already enabled")

          serial = os.environ["CERT_SERIAL"].lstrip("0").upper()
          certs = call("GET", "/certificates?limit=200")["data"]
          cert = [c for c in certs if (c["attributes"].get("serialNumber") or "").lstrip("0").upper() == serial]
          if not cert:
              raise SystemExit("The signing certificate (serial " + serial + ") is not in this team - revoked?")
          print("certificate:", cert[0]["attributes"].get("name"), cert[0]["attributes"].get("certificateType"))

          for old in call("GET", "/profiles?filter[name]=" + urllib.parse.quote(NAME))["data"]:
              call("DELETE", "/profiles/" + old["id"])
              print("removed the previous profile", old["id"])

          created = call("POST", "/profiles", {"data": {
              "type": "profiles",
              "attributes": {"name": NAME, "profileType": "IOS_APP_STORE"},
              "relationships": {
                  "bundleId": {"data": {"type": "bundleIds", "id": bundle[0]["id"]}},
                  "certificates": {"data": [{"type": "certificates", "id": cert[0]["id"]}]},
              },
          }})["data"]
          content = base64.b64decode(created["attributes"]["profileContent"])
          uuid = created["attributes"]["uuid"]
          home = pathlib.Path.home()
          for folder in ["Library/MobileDevice/Provisioning Profiles", "Library/Developer/Xcode/UserData/Provisioning Profiles"]:
              target = home / folder
              target.mkdir(parents=True, exist_ok=True)
              (target / (uuid + ".mobileprovision")).write_bytes(content)
          print("installed profile", NAME, uuid)
          PY

      - name: Archive
        run: |
          xcodebuild archive \
            -project NordicSportsCompanion.xcodeproj \
            -scheme NordicSportsCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the API key, the keychain and the app secrets
        if: always()
        run: |
          rm -rf "$(dirname "$KEY_PATH")" "$RUNNER_TEMP/dist.p12" Secrets.xcconfig
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
