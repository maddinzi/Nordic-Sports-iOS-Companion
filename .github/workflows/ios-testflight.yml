name: iOS TestFlight

# Builds the app on a cloud Mac and uploads it to TestFlight. Started by hand
# (Actions > iOS TestFlight > Run workflow) - macOS minutes are expensive.
# Signing: automatic, with the App Store Connect API key in the secrets
# ASC_ISSUER_ID, ASC_KEY_ID and ASC_KEY_P8 (never printed, deleted after the run).
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      # The runner context isn't available in the job's env block, so paths are set here.
      - name: Paths
        run: |
          echo "KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$RUNNER_TEMP/NordicSportsCompanion.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/export" >> "$GITHUB_ENV"

      - name: Xcode version
        run: xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      # Checks the key's shape and asks the App Store Connect API directly, so a 401 comes
      # with Apple's reason. Prints only lengths, formats and the API's answer - never the key.
      - name: Check the API key
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 - <<'PY'
          import json, os, re, time, urllib.request, urllib.error
          import jwt

          key_id, issuer = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]
          key = open(os.environ["KEY_PATH"], encoding="utf-8").read()
          print("Key ID: 10 characters, letters and digits:", bool(re.fullmatch(r"[A-Z0-9]{10}", key_id)))
          print("Issuer ID: a UUID:", bool(re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", issuer)))
          print("Key file: starts with BEGIN PRIVATE KEY:", key.lstrip().startswith("-----BEGIN PRIVATE KEY-----"))
          print("Key file: ends with END PRIVATE KEY:", key.rstrip().endswith("-----END PRIVATE KEY-----"))
          print("Key file: lines:", len(key.strip().splitlines()))

          token = jwt.encode(
              {"iss": issuer, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"},
          )
          url = "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=me.maddin.nordicsports.companion"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
          try:
              with urllib.request.urlopen(request) as response:
                  apps = json.load(response)["data"]
                  print("App Store Connect API: OK, apps with this bundle id:", [a["attributes"]["name"] for a in apps])
          except urllib.error.HTTPError as e:
              print("App Store Connect API: HTTP", e.code)
              for err in json.load(e).get("errors", []):
                  print(" -", err.get("code"), "|", err.get("title"), "|", err.get("detail"))
              raise SystemExit(1)
          PY

      # The team's Apple Distribution certificate (secrets DIST_CERT_P12 as base64 and
      # DIST_CERT_PASSWORD), in a temporary keychain. Signing for the App Store this way
      # needs no registered device, and no new certificate is created per run.
      - name: Signing certificate
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          # Fingerprints only, to compare with the files the secrets came from - never the values.
          echo "password length: ${#DIST_CERT_PASSWORD}, sha256 prefix: $(printf '%s' "$DIST_CERT_PASSWORD" | shasum -a 256 | cut -c1-8)"
          echo "p12 base64 length: ${#DIST_CERT_P12}, decoded p12 sha256 prefix: $(shasum -a 256 "$RUNNER_TEMP/dist.p12" | cut -c1-16)"
          if openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -passin env:DIST_CERT_PASSWORD -noout > /dev/null 2>&1; then
            echo "openssl: the password opens the p12"
          else
            echo "openssl: the password does NOT open the p12 (or the p12 is damaged)"
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        run: |
          xcodebuild archive \
            -project NordicSportsCompanion.xcodeproj \
            -scheme NordicSportsCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the API key and the keychain
        if: always()
        run: |
          rm -rf "$(dirname "$KEY_PATH")" "$RUNNER_TEMP/dist.p12"
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
